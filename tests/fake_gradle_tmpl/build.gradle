plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'log4j:log4j:1.2.17'
    implementation "commons-collections:commons-collections:3.2.1"
    implementation group: 'org.apache.struts', name: 'struts2-core', version: '2.3.15'
    testImplementation 'junit:junit:4.12'
}
